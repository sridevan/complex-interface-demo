name: Deploy demo to GitHub Pages

# Builds the Vite app (the prebuild step stages the committed demo data into
# public/) and publishes app-react/dist to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-react/package-lock.json
      - name: Install dependencies
        working-directory: app-react
        run: npm ci
      - name: Build (stages demo data, then vite build)
        working-directory: app-react
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
